<style>
:root{--o:#FC5C2B;--o2:#FC784F;--o3:#FD9E81;--obg:#FFECE6;--y:#FFF231;--y3:#FFFAB3;--ink:#222;--ink2:#4D4D4D;--mute:#A0A0A0;--line:#EDEDED;--gray:#F5F5F5}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:#F2F2F2;color:var(--ink);font:16px/1.6 Pretendard,"Pretendard Variable","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column}
header{height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);flex:none}
header a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:900;font-size:18px;letter-spacing:-.5px}
header img{width:28px;height:28px}
main{flex:1;padding:24px 20px 40px}
.screen{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--o);color:#fff;font-size:18px;font-weight:800;text-decoration:none;transition:.2s ease}
.btn:hover{background:var(--o2)}
.btn.sub{background:var(--gray);color:var(--ink)}
.btn.sub:hover{background:#EBEBEB}
.btn.yel{background:var(--y);color:var(--ink)}

/* intro */
.cover{position:relative;aspect-ratio:1;border-radius:24px;background:var(--o);overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:22px;align-content:center}
.cover img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:bob 2.8s ease-in-out infinite}
.cover img:nth-child(1){transform:rotate(-6deg)}.cover img:nth-child(2){animation-delay:.3s}.cover img:nth-child(3){transform:rotate(5deg);animation-delay:.6s}
.cover img:nth-child(4){transform:rotate(4deg);animation-delay:.9s}.cover img:nth-child(5){animation-delay:1.2s}.cover img:nth-child(6){transform:rotate(-5deg);animation-delay:1.5s}
@keyframes bob{50%{translate:0 -5px}}
.intro{text-align:center}
.intro h1{font-size:34px;line-height:1.2;letter-spacing:-1.5px;font-weight:900;margin:26px 0 8px}
.intro .q{font-size:19px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.intro .note{font-size:13px;color:var(--mute);margin:0 0 28px}

/* quiz */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.back{border:0;background:none;width:36px;height:44px;font-size:22px;color:var(--ink2);padding:0;flex:none}
.back:disabled{visibility:hidden}
.bar{flex:1;height:8px;background:var(--gray);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--o);border-radius:99px;transition:width .35s ease}
.num{font-size:14px;font-weight:700;color:var(--mute);flex:none;width:44px;text-align:right}
.qn{text-align:center;color:var(--o);font-weight:900;font-size:22px;margin:0 0 6px}
.qt{text-align:center;font-size:23px;line-height:1.4;letter-spacing:-.8px;font-weight:800;margin:0 0 36px;min-height:2.8em;text-wrap:balance;word-break:keep-all}
.opts{display:grid;gap:12px}
.opt{border:0;border-radius:16px;background:var(--gray);color:var(--ink);min-height:64px;padding:16px 20px;font-size:17px;font-weight:700;text-align:center;word-break:keep-all;transition:.2s ease}
.opt:hover{background:var(--obg)}
.opt.on{background:var(--o);color:#fff}

/* loading */
.loading{text-align:center;padding-top:80px}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--obg);border-top-color:var(--o);margin:0 auto 24px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading p{font-size:19px;font-weight:800;margin:0}

/* result */
.res{text-align:center}
.res .pre{font-size:16px;font-weight:700;color:var(--ink2);margin:6px 0 4px}
.res h2{font-size:30px;line-height:1.25;letter-spacing:-1.2px;font-weight:900;margin:0 0 10px;word-break:keep-all}
.chip{display:inline-block;background:var(--y);border-radius:99px;padding:4px 16px;font-weight:900;font-size:16px;margin-bottom:22px}
.hero{width:min(300px,78%);aspect-ratio:1;margin:0 auto 18px;border-radius:28px;overflow:hidden;background:#222}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.say{font-weight:700;color:var(--ink2);margin:0 0 18px}
.desc{font-size:16px;line-height:1.7;margin:0 0 26px;word-break:keep-all}
.box{background:var(--gray);border-radius:20px;padding:22px 20px;text-align:left;margin-bottom:14px}
.box h3{font-size:17px;margin:0 0 12px;letter-spacing:-.4px}
.box ul{margin:0;padding:0;list-style:none}
.box li{position:relative;padding-left:16px;margin:8px 0;line-height:1.5;word-break:keep-all}
.box li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--o)}
.why li small{display:block;color:var(--mute);font-size:13px}
.mates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.mate{background:var(--gray);border-radius:20px;padding:18px 12px;text-align:center}
.mate small{display:block;font-size:13px;font-weight:800;color:var(--o);margin-bottom:10px}
.mate.bad small{color:var(--ink2)}
.mate img{width:72px;height:72px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 10px}
.mate b{display:block;font-size:15px;letter-spacing:-.3px}
.mate p{font-size:13px;color:var(--ink2);margin:4px 0 0;line-height:1.45;word-break:keep-all}
.acts{display:grid;gap:10px}
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.on{display:block}
.sheet .dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:96vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:18px;text-align:center}
.sheet .pv{display:grid;place-items:center;min-height:200px;margin-bottom:14px}
.sheet .pv img{width:100%;max-height:52vh;object-fit:contain;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.sheet .pv .spin{margin:0}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sheet .btn{min-height:52px;font-size:16px}
.sheet .tip{font-size:13px;color:var(--mute);text-align:center;margin:10px 0 0;word-break:keep-all}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:#222;color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;transition:.3s ease;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:12px;color:var(--mute);padding:0 20px 28px}
footer a{color:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 </div>
</div>

 ['단톡방에서 나는?',[['말이 제일 많은 사람',{V:2,E:1},'톡방에서도 메인 보컬'],['읽씹 장인',{B:3},'읽고 조용히 있는 것도 실력'],['이모티콘으로만 대화하는 사람',{E:3},'말보다 리액션이 먼저인 사람'],['공지 올리고 정리하는 사람',{K:2,D:1},'계획형 손끝, 키보드 확정']]],
 ['치킨 먹을 때 제일 먼저 집는 부위는?',[['닭다리',{D:3},'페달 밟는 다리 힘은 여기서 나옴'],['날개',{V:2,G:1},'날개 달고 고음으로 날아오름'],['퍽퍽살',{B:3},'담백함이 낮은 음과 닮음'],['다 좋다, 남은 거 먹는 편',{E:2,K:1},'뭐든 OK인 만능 세션']]],
 ['헤어스타일 고를 때 나는?',[['흩날리는 긴 머리가 좋다',{G:3},'머리 휘날리는 기타 솔로는 국룰'],['땀 나도 괜찮은 짧은 머리',{D:3},'땀 제일 많이 흘리는 세션'],['매일매일 바꾸는 편',{V:1,E:2},'변신은 무대 체질이라는 뜻'],['모자로 해결한다',{B:2,K:1},'모자 쓴 베이시스트, 왠지 익숙함']]],
 ['무대에 선다면 내 자리는?',[['앞쪽 정중앙',{V:3},'센터는 보컬 자리'],['한가운데지만 뒤쪽',{D:3},'가운데 뒤는 드럼 자리'],['옆쪽 어딘가',{G:1,B:1,K:1},'사이드도 멋있음'],['무대보다 객석이 좋다',{E:3},'관객석에서 끌려 올라오는 흥 담당']]]
];
const MAX={};ORDER.forEach(t=>MAX[t]=Q.reduce((s,q)=>s+Math.max(0,...q[1].map(o=>o[1][t]||0)),0));
const app=document.getElementById('app');
let i=0,ans=[],busy=false;
const clearHash=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};

function intro(){
  i=0;ans=[];
  app.innerHTML=`<div class="screen intro">
   <div class="cover">${ORDER.map(t=>`<img src="${T[t].img}" alt="${T[t].name}">`).join('')}</div>
   <h1>밴드 세션 테스트</h1>
   <p class="q">나는 어떤 밴드 세션일까?</p>
   <p class="note">재미로 보는 테스트 (실력과 전혀 상관없음)</p>
   <button class="btn" id="go">시작하기</button></div>`;
  document.getElementById('go').onclick=()=>{clearHash();quiz()};
}
function quiz(){
  const q=Q[i];
  app.innerHTML=`<div class="screen">
   <div class="prog"><button class="back" id="back" aria-label="이전 질문" ${i?'':'disabled'}>‹</button><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><span class="num">${i+1}/${Q.length}</span></div>
   <p class="qn">Q${i+1}.</p>
   <p class="qt">${q[0]}</p>
   <div class="opts">${q[1].map((o,n)=>`<button class="opt${ans[i]===n?' on':''}" data-n="${n}">${o[0]}</button>`).join('')}</div></div>`;
  requestAnimationFrame(()=>{const b=app.querySelector('.bar i');if(b)b.style.width=((i+1)/Q.length*100)+'%'});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  document.getElementById('back').onclick=()=>{if(i>0&&!busy){i--;quiz()}};
  window.scrollTo(0,0);
}
function pick(n){
  if(busy)return;busy=true;ans[i]=n;
  app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  setTimeout(()=>{busy=false;if(++i<Q.length)quiz();else analyze()},250);
}
function analyze(){
  const s={};ORDER.forEach(t=>s[t]=0);
  ans.forEach((n,k)=>{const sc=Q[k][1][n][1];for(const t in sc)s[t]+=sc[t]});
  const norm={};ORDER.forEach(t=>norm[t]=Math.max(0,s[t])/MAX[t]);
  const win=ORDER.reduce((a,b)=>norm[b]>norm[a]||(norm[b]===norm[a]&&s[b]>s[a])?b:a);
  const picked=ans.map((n,k)=>({q:Q[k][0],o:Q[k][1][n]}));
  const why=picked.filter(p=>(p.o[1][win]||0)>0).sort((a,b)=>b.o[1][win]-a.o[1][win]).slice(0,2);
  const out=picked.filter(p=>Object.values(p.o[1]).some(v=>v<0));
  app.innerHTML=`<div class="screen loading"><div class="spin"></div><p>결과 분석 중… 🎵</p></div>`;
  setTimeout(()=>result(win,{why,out}),1200);
}
function result(t,d){
  const r=T[t];
  try{history.replaceState(null,'','#'+SLUG[t])}catch(e){}
  const mate=(m,cls,label)=>`<div class="mate ${cls}"><small>${label}</small><img src="${T[m[0]].img}" alt=""><b>${T[m[0]].name}</b><p>${m[1]}</p></div>`;
  const reasons=d?[...d.why,...d.out.filter(p=>!d.why.includes(p))]:[];
  const whyHtml=reasons.length?`<div class="box why"><h3>결정적 이유 🔍</h3><ul>${reasons.map(p=>`<li><small>${p.o[0]}</small>${(p.o[1][t]||0)<0?`탈락 위기를 뚫고 결국 ${r.name}! 😂`:p.o[2]}</li>`).join('')}</ul></div>`:'';
  app.innerHTML=`<div class="screen res">
   <p class="pre">나의 밴드 세션은</p>
   <h2>${r.type}</h2>
   <span class="chip">${r.name}</span>
   <div class="hero"><img src="${r.img}" alt="${r.name}"></div>
   <p class="say">${r.say}</p>
   <p class="desc">${r.desc.join('<br>')}</p>
   <div class="box"><h3>이런 사람이 ${r.name}!</h3><ul>${r.list.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   ${whyHtml}
   <div class="mates">${mate(r.best,'','💛 찰떡 궁합')}${mate(r.worst,'bad','💥 환장 궁합')}</div>
   <div class="acts">
    <button class="btn" id="share">결과 공유하기</button>
    <button class="btn sub" id="again">테스트 다시하기</button>
    <a class="btn yel" href="${APP}" target="_blank" rel="noopener">JAM에서 진짜 밴드 멤버 찾기 🎸</a>
   </div></div>`;
  document.getElementById('again').onclick=()=>{clearHash();intro();window.scrollTo(0,0)};
  document.getElementById('share').onclick=()=>openShare(t);
  window.scrollTo(0,0);
}

/* ---------- 공유 이미지 ---------- */
const APP='https://apps.apple.com/app/apple-store/id6759896230?pt=127381151&ct=session-test&mt=8';
const FONT='Pretendard,"Noto Sans KR",sans-serif';
const loadImg=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,text,max){const out=[];let line='';for(const w of text.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>max&&line){out.push(line);line=w}else line=t}out.push(line);return out}
async function makeCard(t){
  const r=T[t],W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  try{await Promise.all(['500 36px','700 40px','900 76px','900 40px'].map(f=>document.fonts.load(`${f} "Noto Sans KR"`)))}catch(e){}
  const [art,logo]=await Promise.all([loadImg(r.img),loadImg(A+'jam_logo_small.png')]);
  c.fillStyle='#FC5C2B';c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,242,49,.35)';c.beginPath();c.arc(90,120,150,0,7);c.fill();c.beginPath();c.arc(1000,1180,190,0,7);c.fill();
  const cx=60,cy=60,cw=W-120,ch=1110;
  c.fillStyle='#fff';rr(c,cx,cy,cw,ch,56);c.fill();
  c.textAlign='center';c.textBaseline='alphabetic';
  c.font=`900 76px ${FONT}`;
  const lines=wrap(c,r.type,cw-120);
  const total=40+100+(lines.length-1)*92+40+100+520+80;
  let y=cy+Math.max(70,(ch-total)/2)+40;
  c.fillStyle='#4D4D4D';c.font=`700 40px ${FONT}`;c.fillText('나의 밴드 세션은',W/2,y);
  c.fillStyle='#222';c.font=`900 76px ${FONT}`;y+=100;
  lines.forEach((l,k)=>c.fillText(l,W/2,y+k*92));y+=(lines.length-1)*92+40;
  c.font=`900 40px ${FONT}`;const tw=c.measureText(r.name).width+72;
  c.fillStyle='#FFF231';rr(c,W/2-tw/2,y,tw,68,34);c.fill();
  c.fillStyle='#222';c.fillText(r.name,W/2,y+48);y+=100;
  const size=Math.min(520,cy+ch-y-130);
  c.save();rr(c,W/2-size/2,y,size,size,52);c.clip();c.drawImage(art,W/2-size/2,y,size,size);c.restore();
  y+=size+80;
  c.fillStyle='#4D4D4D';c.font=`500 36px ${FONT}`;c.fillText(r.say,W/2,y,cw-80);
  c.fillStyle='#fff';c.beginPath();c.arc(118,1260,38,0,7);c.fill();c.drawImage(logo,90,1232,56,56);
  c.textAlign='left';c.fillStyle='#fff';c.font=`900 40px ${FONT}`;c.fillText('밴드 세션 테스트',176,1274);
  c.textAlign='right';c.font=`700 32px ${FONT}`;c.fillText('너는 어떤 세션? 🎸',W-70,1272);
  return new Promise(ok=>cv.toBlob(ok,'image/png'));
}
let shareFile=null,shareMsg='';
async function openShare(t){
  const r=T[t],sheet=document.getElementById('sheet');
  shareMsg=`나의 밴드 세션은 ${r.name}! “${r.type}”\n너도 해보기 👉 ${location.origin+location.pathname}`;
  sheet.querySelector('.pv').innerHTML='<div class="spin"></div>';
  sheet.classList.add('on');
  try{
    const blob=await makeCard(t);
    shareFile=new File([blob],`jam-band-session-${SLUG[t]}.png`,{type:'image/png'});
    const url=URL.createObjectURL(blob);
    sheet.querySelector('.pv').innerHTML=`<img src="${url}" alt="${r.name} 결과 이미지">`;
    const dl=document.getElementById('dl');dl.href=url;dl.download=shareFile.name;
  }catch(e){sheet.querySelector('.pv').innerHTML='<p>이미지를 만들지 못함. 링크 복사로 공유하기</p>'}
  const can=!!(shareFile&&navigator.canShare&&navigator.canShare({files:[shareFile]}));
  document.getElementById('sendimg').style.display=can?'':'none';
}
document.getElementById('sendimg').onclick=()=>{
  if(!shareFile)return;
  navigator.share({files:[shareFile],title:'밴드 세션 테스트'}).catch(()=>{});
};
document.getElementById('copylink').onclick=()=>{
  const done=()=>toast('복사 완료! 카톡에 붙여넣기 🎵');
  try{navigator.clipboard.writeText(shareMsg).then(done,()=>prompt('메시지를 복사해서 공유하기',shareMsg))}catch(e){prompt('메시지를 복사해서 공유하기',shareMsg)}
};
document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>document.getElementById('sheet').classList.remove('on'));
function toast(msg){const el=document.getElementById('toast');if(msg)el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1800)}
document.addEventListener('keydown',e=>{
  if(!app.querySelector('.opts'))return;
  const n=parseInt(e.key,10);if(n>=1&&n<=4)pick(n-1);
  if(e.key==='Backspace'&&i>0&&!busy){i--;quiz()}
});
const hit=ORDER.find(t=>SLUG[t]===location.hash.slice(1));
hit?result(hit,null):intro();
}
</script>
