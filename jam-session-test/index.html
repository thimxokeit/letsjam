<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 밴드 세션 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 친근한 ~요 체, 밴드 몰라도 웃으면서 푸는 아무말 성격테스트
   IDEA: 합주실 문 앞 멤버 모집 포스터 같은 카드 한 장
   PICTURE: JAM 세션 일러스트 (인트로는 6장 무대, 결과는 큰 내 악기)
   COLOUR/TYPE: JAM Bold Orange 바탕 + Joyful Yellow 액센트 + Organized Black, Pretendard
   LAYOUT: 가운데 둥근 카드, 질문은 한 줄 컬럼, 모바일 우선 */
:root{color-scheme:light dark;
  --o:#FC5C2B;--o2:#FC784F;--o3:#FD9E81;--y:#FFF231;--y2:#FFF566;--y3:#FFFAB3;
  --bg:light-dark(#FC5C2B,#2a140c);--card:light-dark(#ffffff,#1e1a19);
  --ink:light-dark(#222222,#f4eeeb);--ink2:light-dark(#4D4D4D,#c9c0bc);
  --mute:light-dark(#A0A0A0,#8d8481);--line:light-dark(#D9D9D9,#3a3332);
  --soft:light-dark(#FFECE6,#3a2018);--chip:light-dark(#FFFDE6,#2e2a1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.6 Pretendard,"Pretendard Variable","Noto Sans KR",system-ui,sans-serif;overflow-x:clip;
  background-image:radial-gradient(circle at 10% 16%,rgba(255,242,49,.35) 0 90px,transparent 91px),radial-gradient(circle at 92% 84%,rgba(255,242,49,.28) 0 130px,transparent 131px)}
header{max-width:640px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-1px}
.logo img{width:42px;height:42px;border-radius:14px;background:#fff;padding:4px}
.hint{font-size:13px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--card);border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 40px rgba(60,20,0,.22)}
.screen{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(32px,7vw,48px);line-height:1.1;letter-spacing:-2px;font-weight:900;margin:0 0 12px;text-wrap:balance}
h2{font-size:clamp(22px,5vw,28px);line-height:1.3;letter-spacing:-1px;font-weight:800;margin:0 0 22px;text-wrap:balance}
h3{font-size:17px;margin:0 0 10px;letter-spacing:-.4px}
p{margin:0 0 12px;color:var(--ink2)}
.small{font-size:13px;color:var(--mute)}
.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:24px 0 26px}
.tile{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1;background:#222;animation:bob 2.6s ease-in-out infinite}
.tile:nth-child(2n){animation-delay:.35s}.tile:nth-child(3n){animation-delay:.7s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{position:absolute;left:8px;bottom:8px;background:var(--y);color:#222;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;border-radius:999px;min-height:54px;padding:12px 28px;background:var(--o);color:#fff;transition:.3s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--o2);transform:translateY(-2px);box-shadow:0 8px 18px rgba(252,92,43,.35)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--o);color:var(--o)}
.btn.yel{background:var(--y);color:#222}.btn.yel:hover{background:var(--y2)}
.btn:focus-visible,.opt:focus-visible,.back:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.wide{width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.back{appearance:none;border:0;background:none;font:inherit;color:var(--mute);cursor:pointer;min-height:44px;padding:0 4px;font-size:14px}
.back:disabled{visibility:hidden}
.count{font-weight:800;color:var(--o);font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));border-radius:99px;transition:width .4s ease}
.qno{display:inline-block;background:var(--y);color:#222;font-weight:900;border-radius:12px;padding:2px 12px;font-size:14px;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{appearance:none;font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:15px 18px;min-height:58px;display:flex;gap:12px;align-items:center;transition:.3s ease}
.opt:hover{border-color:var(--o3);background:var(--soft);transform:translateY(-2px)}
.opt.on{border-color:var(--o);background:var(--o);color:#fff}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--soft);color:var(--o)}
.opt.on .k{background:#fff}
.loading{text-align:center;padding:36px 0}
.loading .tile{width:150px;margin:0 auto 20px;animation:shake .5s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.hero{display:grid;justify-items:center;text-align:center}
.big{width:min(240px,64vw);aspect-ratio:1;border-radius:36px;overflow:hidden;background:#222;margin-bottom:18px;box-shadow:0 0 0 8px var(--y);transform:rotate(-3deg)}
.big img{width:100%;height:100%;object-fit:cover;display:block}
.tag{font-weight:800;color:var(--o);font-size:15px;margin:8px 0 4px}
.quote{background:var(--soft);border-radius:20px;padding:14px 18px;font-weight:700;margin:18px 0 6px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.chips span{background:var(--chip);border:1.5px solid var(--y);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:700}
.sec{margin-top:28px}
.why{display:grid;gap:10px}
.why div{border-radius:18px;background:var(--chip);padding:12px 16px;font-size:15px}
.why small{display:block;color:var(--mute);font-weight:700;font-size:13px}
.why.out div{background:var(--soft)}
.dna{display:grid;gap:9px}
.row{display:grid;grid-template-columns:6.5em minmax(0,1fr) 3em;align-items:center;gap:10px;font-size:14px;font-weight:700}
.row .t{height:14px;border-radius:99px;background:var(--soft);overflow:hidden}
.row .t i{display:block;height:100%;background:var(--o3);border-radius:99px;transition:width .8s ease}
.row.me .t i{background:var(--o)}
.row .n{text-align:right;color:var(--mute);white-space:nowrap}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mate{border-radius:22px;padding:14px;background:var(--soft);display:flex;gap:12px;align-items:center}
.mate.y{background:var(--chip)}
.mate img{flex:none;width:58px;height:58px;border-radius:16px;object-fit:cover;background:#222}
.mate small{display:block;color:var(--mute);font-size:12px;font-weight:700}
.mate b{display:block;font-size:15px;letter-spacing:-.4px}
.mate p{font-size:13px;margin:2px 0 0;line-height:1.45}
.fate{border-left:4px solid var(--y);padding:4px 0 4px 14px}
.acts{display:grid;gap:10px;margin-top:30px}
.acts .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:#222;color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;transition:.3s ease;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copybox{width:100%;margin-top:6px;font:inherit;font-size:14px;border-radius:14px;border:2px solid var(--line);padding:10px;background:var(--card);color:var(--ink);display:none}
@media(max-width:600px){.pair{grid-template-columns:1fr}.stage{gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  ['흩날리는 머리가 좋아요',{G:3},'머리 휘날리는 기타 솔로, 국룰이죠'],
  ['땀 나도 괜찮은 짧은 머리',{D:3},'땀 제일 많이 흘리는 세션이에요'],
  ['매일매일 바꿔요',{V:1,E:2},'변신은 무대 체질이라는 뜻'],
  ['모자로 해결해요',{B:2,K:1},'모자 쓴 베이시스트, 왠지 익숙하죠']]],
 ['무대에 선다면 어디에 있고 싶어요?',[
  ['앞쪽 정중앙',{V:3},'센터는 보컬 자리예요'],
  ['한가운데지만 뒤쪽',{D:3},'가운데 뒤는 드럼 자리예요'],
  ['옆쪽 어딘가',{G:1,B:1,K:1},'사이드도 멋있어요'],
  ['무대보다 객석이 좋아요',{E:3},'관객석에서 끌려 올라오는 흥 담당']]]
];
const MAX={};ORDER.forEach(t=>MAX[t]=Q.reduce((s,q)=>s+Math.max(0,...q[1].map(o=>o[1][t]||0)),0));
const app=document.getElementById('app');
let i=0,ans=[],busy=false;

function intro(){
  i=0;ans=[];
  app.innerHTML=`<div class="screen">
   <h1>나에게 딱 맞는<br>밴드 세션은? 🎶</h1>
   <p>밴드 안 해봤어도 괜찮아요! 사진 찍는 자리, 치킨 부위만으로 알아보는 나의 밴드 포지션이에요.</p>
   <div class="stage">${ORDER.map(t=>`<div class="tile"><img src="${T[t].img}" alt=""><b>${T[t].name}</b></div>`).join('')}</div>
   <button class="btn wide" id="go">테스트 시작하기 🎸</button>
   <p class="small" style="text-align:center;margin:12px 0 0">질문 10개 · 1분이면 끝나요</p></div>`;
  document.getElementById('go').onclick=quiz;
}
function quiz(){
  const q=Q[i];
  app.innerHTML=`<div class="screen">
   <div class="top"><button class="back" id="back" ${i?'':'disabled'}>← 이전</button><span class="count">${i+1} / ${Q.length}</span></div>
   <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
   <span class="qno">Q${i+1}</span>
   <h2>${q[0]}</h2>
   <div class="opts">${q[1].map((o,n)=>`<button class="opt${ans[i]===n?' on':''}" data-n="${n}"><span class="k">${n+1}</span><span>${o[0]}</span></button>`).join('')}</div></div>`;
  requestAnimationFrame(()=>{const b=app.querySelector('.bar i');if(b)b.style.width=((i+1)/Q.length*100)+'%'});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  document.getElementById('back').onclick=()=>{if(i>0&&!busy){i--;quiz()}};
}
function pick(n){
  if(busy)return;busy=true;ans[i]=n;
  app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  setTimeout(()=>{busy=false;if(++i<Q.length)quiz();else tuning()},260);
}
function tuning(){
  const s={};ORDER.forEach(t=>s[t]=0);
  ans.forEach((n,k)=>{const sc=Q[k][1][n][1];for(const t in sc)s[t]+=sc[t]});
  const norm={};ORDER.forEach(t=>norm[t]=Math.max(0,s[t])/MAX[t]);
  const win=ORDER.reduce((a,b)=>norm[b]>norm[a]||(norm[b]===norm[a]&&s[b]>s[a])?b:a);
  const sum=ORDER.reduce((a,t)=>a+norm[t],0)||1;
  const pct={};ORDER.forEach(t=>pct[t]=Math.round(norm[t]/sum*100));
  const picked=ans.map((n,k)=>({q:Q[k][0],o:Q[k][1][n]}));
  const why=picked.filter(p=>(p.o[1][win]||0)>0).sort((a,b)=>b.o[1][win]-a.o[1][win]).slice(0,2);
  const out=picked.filter(p=>Object.values(p.o[1]).some(v=>v<0));
  app.innerHTML=`<div class="screen loading"><div class="tile"><img src="${T[win].img}" alt=""></div><h2 style="margin:0">튜닝하는 중이에요… 🎵</h2><p class="small">나에게 맞는 세션을 찾고 있어요</p></div>`;
  setTimeout(()=>result(win,{pct,why,out}),1100);
}
function result(t,d){
  const r=T[t];
  try{history.replaceState(null,'','#'+SLUG[t])}catch(e){}
  const m=T[r.best[0]];
  const whyHtml=d&&d.why.length?`<div class="sec"><h3>결정적 이유 🔍</h3><div class="why">${d.why.map(p=>`<div><small>${p.q} → ${p.o[0]}</small>${p.o[2]}</div>`).join('')}</div></div>`:'';
  const outHtml=d&&d.out.length?`<div class="sec"><div class="why out">${d.out.map(p=>`<div><small>${p.o[0]}</small>${p.o[2]} 😂</div>`).join('')}</div></div>`:'';
  const dna=d?`<div class="sec"><h3>나의 세션 DNA 🧬</h3><div class="dna">${ORDER.slice().sort((a,b)=>d.pct[b]-d.pct[a]).map(k=>`<div class="row${k===t?' me':''}"><span>${T[k].name}</span><span class="t"><i style="width:0" data-w="${d.pct[k]}"></i></span><span class="n">${d.pct[k]}%</span></div>`).join('')}</div></div>`:'';
  app.innerHTML=`<div class="screen">
   <div class="hero"><div class="big"><img src="${r.img}" alt="${r.name}"></div>
    <div class="tag">나에게 맞는 밴드 세션은</div>
    <h1 style="margin-bottom:6px">${r.name}</h1>
    <p style="font-weight:800;color:var(--ink);font-size:19px;margin-bottom:14px">“${r.type}”</p>
    <div class="chips">${r.traits.map(x=>`<span>#${x}</span>`).join('')}</div></div>
   <div class="quote">${r.quote}</div>
   <div class="sec"><p style="color:var(--ink)">${r.desc}</p></div>
   ${whyHtml}${outHtml}${dna}
   <div class="sec"><h3>${r.name}의 숙명</h3><p class="fate">${r.fate}</p></div>
   <div class="sec"><h3>찰떡 궁합 💛</h3><div class="mate y"><img src="${m.img}" alt=""><div><small>같이 하면 좋은 세션</small><b>${m.name}</b><p>${r.best[1]}</p></div></div></div>
   <div class="acts">
    <a class="btn yel wide" href="https://letsjam.work" target="_blank" rel="noopener">JAM에서 진짜 밴드 멤버 찾기 🎸</a>
    <div class="two"><button class="btn ghost" id="copy">결과 복사하기</button><button class="btn" id="again">다시 하기</button></div>
    <textarea class="copybox" id="cbox" rows="3" readonly></textarea>
   </div></div>`;
  requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll('.row .t i').forEach(e=>e.style.width=e.dataset.w+'%'),60));
  document.getElementById('again').onclick=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}intro();window.scrollTo(0,0)};
  document.getElementById('copy').onclick=()=>{
    const txt=`나에게 맞는 밴드 세션은 ${r.name}! “${r.type}”\n${r.traits.map(x=>'#'+x).join(' ')}\n너는 무슨 세션이야? 🎶 JAM 밴드 세션 테스트`;
    const box=document.getElementById('cbox');
    const show=()=>{box.value=txt;box.style.display='block';box.select()};
    try{navigator.clipboard.writeText(txt).then(toast,show)}catch(e){show()}
  };
  window.scrollTo(0,0);
}
function toast(){const el=document.getElementById('toast');el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1800)}
document.addEventListener('keydown',e=>{
  if(!app.querySelector('.opts'))return;
  const n=parseInt(e.key,10);if(n>=1&&n<=4)pick(n-1);
  if(e.key==='Backspace'&&i>0&&!busy){i--;quiz()}
});
const h=location.hash.slice(1);const hit=ORDER.find(t=>SLUG[t]===h);
hit?result(hit,null):intro();
}
</script>
</body>
</html>
